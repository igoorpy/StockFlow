<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Editar Produto</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="topbar">
        <div class="topbar-container" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="brand-title">StockFlow</h2>
            <nav class="nav-links" style="display: flex; align-items: center; gap: 1rem;">
                {% if session.get('cargo') == 'admin' %}
                    <a href="/produtos">← Voltar para Produtos</a>
                {% endif %}
                <a href="/vendas">Módulo de Vendas</a>
                <a href="/clientes">Clientes</a>
                {% if session.get('cargo') == 'admin' %}
                    <a href="/usuarios">Usuários</a>
                    <a href="/auditoria">Auditoria</a>
                {% endif %}
                <span style="font-size: 0.8rem; background: rgba(255,255,255,0.15); padding: 0.25rem 0.5rem; border-radius: 4px;">
                    👤 {{ session.get('nome') }} ({{ session.get('cargo')|upper }})
                </span>
                <a href="/logout" style="color: #f87171; text-decoration: none; font-size: 0.85rem; font-weight: bold;">Sair</a>
            </nav>
        </div>
    </header>

    <main class="main-container" style="max-width: 800px;">
        <section class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Editar Produto <span class="badge-id">#{{ produto[0] }}</span></h3>
            </div>

            <form action="/produtos/editar/{{ produto[0] }}" method="POST" class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group span-2">
                    <label>Nome do Produto</label>
                    <input type="text" name="nome" value="{{ produto[1] }}" required>
                </div>

                <div class="form-group span-2">
                    <label>Categoria</label>
                    <input type="text" name="categoria" value="{{ produto[2] }}" required>
                </div>

                <div class="form-group">
                    <label>Preço Unitário (R$)</label>
                    <input type="text" name="preco" value="{{ "%.2f"|format(produto[3]|float) }}" required>
                </div>

                <div class="form-group">
                    <label>Quantidade em Estoque</label>
                    <input type="number" name="quantidade" value="{{ produto[4] }}" min="0" required>
                </div>

                <div class="form-group span-2" style="display: flex; gap: 0.5rem; margin-top: 0.5rem; justify-content: flex-end;">
                    <a href="/produtos" class="btn" style="background-color: #cbd5e1; color: #334155; text-decoration: none; line-height: 1.5; padding: 0.5rem 1rem;">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
